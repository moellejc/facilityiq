services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: facilityiq
      POSTGRES_PASSWORD: facilityiq_dev
      POSTGRES_DB: facilityiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilityiq -d facilityiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: facilityiq
      MINIO_ROOT_PASSWORD: facilityiq-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: dev
    ports:
      - "43123:43123"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://facilityiq_app:facilityiq_app_dev@postgres:5432/facilityiq
      DATABASE_MIGRATE_URL: postgres://facilityiq:facilityiq_dev@postgres:5432/facilityiq
      DATABASE_URL_WORKER: postgres://facilityiq_worker:facilityiq_worker_dev@postgres:5432/facilityiq
      AUTH_SECRET: dev-only-auth-secret-change-me-please
      AUTH_URL: http://localhost:43123
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: facilityiq-models
      S3_ACCESS_KEY_ID: facilityiq
      S3_SECRET_ACCESS_KEY: facilityiq-dev-secret
      S3_FORCE_PATH_STYLE: "true"
      SEED_ON_BOOT: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "docker/dev-entrypoint.sh", "pnpm", "dev"]

  worker:
    build:
      context: .
      target: dev
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://facilityiq_app:facilityiq_app_dev@postgres:5432/facilityiq
      DATABASE_MIGRATE_URL: postgres://facilityiq:facilityiq_dev@postgres:5432/facilityiq
      DATABASE_URL_WORKER: postgres://facilityiq_worker:facilityiq_worker_dev@postgres:5432/facilityiq
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: facilityiq-models
      S3_ACCESS_KEY_ID: facilityiq
      S3_SECRET_ACCESS_KEY: facilityiq-dev-secret
      S3_FORCE_PATH_STYLE: "true"
      SEED_ON_BOOT: "false"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command:
      [
        "sh",
        "-c",
        "i=0; until pnpm db:migrate; do i=$$((i+1)); if [ $$i -gt 10 ]; then exit 1; fi; sleep 2; done; exec pnpm worker:dev",
      ]

volumes:
  postgres_data:
  minio_data:
  app_node_modules:
